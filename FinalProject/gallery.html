<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Skip to Main Content (only visible on focus) -->

    <header>
        <nav>
            <a href="index.html" class="nav-logo">Wanderlust Vietnam</a>
            <a href="index.html">Home</a>
            <a href="gallery.html" class="active">Gallery</a>
            <a href="destinations.html">Destinations</a>
        </nav>
    </header>

    <main id="main-content">
        <h1>Photo Gallery</h1>

        <div class="grid gallery">
            <figure>
                <img src="images/hero.png" alt="Ha Long Bay at sunset with limestone karsts rising from emerald waters">
                <figcaption>Ha Long Bay at Sunset</figcaption>
            </figure>
            <figure>
                <img src="images/sapa.png" alt="Terraced rice fields cascading down green mountain slopes in Sapa">
                <figcaption>Sapa Rice Terraces</figcaption>
            </figure>
            <figure>
                <img src="images/hoian.png" alt="Colorful lanterns reflecting on the river in Hoi An ancient town at night">
                <figcaption>Hoi An Ancient Town</figcaption>
            </figure>
            <figure>
                <img src="images/cave.png" alt="Dramatic stalactites and underground river inside Phong Nha Cave">
                <figcaption>Phong Nha Cave</figcaption>
            </figure>
            <figure>
                <img src="images/mekong.png" alt="Floating market with boats full of tropical fruits on the Mekong Delta">
                <figcaption>Mekong Delta Market</figcaption>
            </figure>
            <figure>
                <img src="images/temple.png" alt="Traditional Vietnamese Buddhist pagoda surrounded by tropical gardens">
                <figcaption>Buddhist Pagoda</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>Created by a student for the Web Design for Everybody Specialization on
